name: Refresh catalog

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
    inputs:
      overwrite_stock:
        description: "Replace live KV quantities with catalog quantities (undoes sales recorded by the webhook)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install xYang
        run: python -m pip install -r requirements-schema.txt

      - name: Test
        run: |
          python -m unittest discover -s tests -v
          node --test tests/js/*.test.mjs

      - name: Parse catalog
        run: python -m catalog parse

      - name: Sync eBay listings
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
        run: python -m catalog ebay

      - name: Build stock document and seed KV
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OVERWRITE_STOCK: ${{ inputs.overwrite_stock && 'true' || 'false' }}
        run: |
          if [ "$OVERWRITE_STOCK" = "true" ]; then
            python -m catalog stock --seed --overwrite
          else
            python -m catalog stock --seed
          fi

      - name: Build site
        run: python -m catalog build

      - name: Validate catalogs against the xYang model
        run: python -m catalog schema --check

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/stock.json docs
          if [ -f data/ebay.json ]; then git add data/ebay.json; fi
          if git diff --staged --quiet; then
            echo "No catalog changes to commit."
          else
            git commit -m "Refresh resistor catalog and rebuild site"
            git push
          fi
