name: Catalog schema

on:
  push:
    paths:
      - "model/**"
      - "catalog/schema.py"
      - "requirements-schema.txt"
      - ".github/workflows/schema.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: catalog-schema-${{ github.ref }}
  cancel-in-progress: false

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'

      - name: Install xYang
        run: python -m pip install -r requirements-schema.txt

      - name: Check the YANG models parse
        run: |
          xyang parse model/audio33-catalog.yang
          xyang parse --include-path model model/audio33-source-listing.yang

      - name: Rebuild the site so docs/catalog.json follows the model
        run: python -m catalog build

      - name: Generate docs/schema and validate both catalogs
        run: python -m catalog schema

      - name: Test
        run: python -m unittest discover -s tests -v

      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Generated artifacts are already up to date."
          else
            git commit -m "Regenerate catalog schema and context with xYang"
            git push
          fi
