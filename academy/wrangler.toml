name = "exergy-academy"
main = "worker/index.js"
compatibility_date = "2026-11-16"

# academy/dist is generated by `python -m academy build` and is not committed.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
DEPLOYMENT = "local"
# CF_ACCOUNT_ID = "your account id"  (with the ANALYTICS_API_TOKEN secret, enables /api/telemetry)

# Workers Rate Limiting binding. namespace_id is any integer unique within the account.
[[ratelimits]]
name = "LAB_LIMITER"
namespace_id = "3301"
simple = { limit = 20, period = 60 }

[[analytics_engine_datasets]]
binding = "LAB_EVENTS"
dataset = "academy_lab"
