name = "exergy-academy"
main = "worker/index.js"
compatibility_date = "2026-11-16"

# academy/dist is generated by `python -m academy build` and is not committed.
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

[observability]
enabled = true
head_sampling_rate = 1

[vars]
DEPLOYMENT = "local"
# Optional: CRAWLER_HOST = "33audio-com.pages.dev" (must match the shop binding)
# With ANALYTICS_API_TOKEN, enables /api/telemetry and /api/crawler-analytics.
CF_ACCOUNT_ID = "5667a04062adaa67fc4d9a20c5bda391"

# Workers Rate Limiting binding. namespace_id is any integer unique within the account.
[[ratelimits]]
name = "LAB_LIMITER"
namespace_id = "3301"
simple = { limit = 20, period = 60 }

[[analytics_engine_datasets]]
binding = "LAB_EVENTS"
dataset = "academy_lab"
